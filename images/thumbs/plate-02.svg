<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <defs>
    <pattern id="grid2" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#2dd4bf" stroke-width="0.5" stroke-opacity="0.12"/>
      <path d="M 200 0 L 0 0 0 200" fill="none" stroke="#2dd4bf" stroke-width="1" stroke-opacity="0.2"/>
    </pattern>
  </defs>
  <rect width="100%" height="100%" fill="#181d22"/>
  <rect width="100%" height="100%" fill="url(#grid2)"/>

  <!-- Border -->
  <rect x="25" y="25" width="750" height="550" fill="none" stroke="#2e353f" stroke-width="2"/>
  <rect x="29" y="29" width="742" height="542" fill="none" stroke="#2dd4bf" stroke-width="0.75" stroke-opacity="0.4"/>

  <!-- Technical Header -->
  <text x="50" y="65" fill="#2dd4bf" font-family="ui-monospace, monospace" font-size="12" letter-spacing="3">PLATE 02 // PHASE 1: FORM &amp; SIGHTING</text>
  <text x="50" y="85" fill="#f1f3f5" font-family="-apple-system, sans-serif" font-size="18" font-weight="bold">Contour Sighting, Plumb Lines &amp; Comparative Measurement</text>
  <text x="50" y="105" fill="#9ba3af" font-family="-apple-system, sans-serif" font-size="12">Reference: The Practice and Science of Drawing by Harold Speed — Sighting Proportions &amp; Mass vs. Line</text>

  <!-- Vertical Plumb Line -->
  <line x1="380" y1="130" x2="380" y2="490" stroke="#38bdf8" stroke-width="1.2" stroke-dasharray="8,4"/>
  <text x="390" y="150" fill="#38bdf8" font-family="ui-monospace, monospace" font-size="10">PLUMB LINE (VERTICAL AXIS)</text>

  <!-- Horizontal Sighting Levels -->
  <line x1="180" y1="210" x2="580" y2="210" stroke="#2dd4bf" stroke-width="1" stroke-dasharray="4,4" stroke-opacity="0.5"/>
  <text x="590" y="214" fill="#2dd4bf" font-family="ui-monospace, monospace" font-size="9">CREST LEVEL</text>

  <line x1="180" y1="350" x2="580" y2="350" stroke="#2dd4bf" stroke-width="1" stroke-dasharray="4,4" stroke-opacity="0.5"/>
  <text x="590" y="354" fill="#2dd4bf" font-family="ui-monospace, monospace" font-size="9">MID-SHOULDER PROPORTION</text>

  <line x1="180" y1="450" x2="580" y2="450" stroke="#2dd4bf" stroke-width="1" stroke-dasharray="4,4" stroke-opacity="0.5"/>
  <text x="590" y="454" fill="#2dd4bf" font-family="ui-monospace, monospace" font-size="9">BASE PEDESTAL</text>

  <!-- Classical Amphora / Form Contour Drawing -->
  <!-- Left Contour Points -->
  <path d="M 380 210 C 350 210 330 220 330 240 C 330 260 360 280 350 320 C 330 370 270 380 270 420 C 270 450 320 450 380 450" fill="none" stroke="#f1f3f5" stroke-width="2.5"/>
  <!-- Right Contour Points -->
  <path d="M 380 210 C 410 210 430 220 430 240 C 430 260 400 280 410 320 C 430 370 490 380 490 420 C 490 450 440 450 380 450" fill="none" stroke="#f1f3f5" stroke-width="2.5"/>

  <!-- Construction Ellipses -->
  <ellipse cx="380" cy="210" rx="50" ry="12" fill="none" stroke="#2dd4bf" stroke-width="1.5"/>
  <ellipse cx="380" cy="320" rx="30" ry="8" fill="none" stroke="#2dd4bf" stroke-width="1" stroke-dasharray="3,3"/>
  <ellipse cx="380" cy="420" rx="110" ry="24" fill="none" stroke="#2dd4bf" stroke-width="1.5" stroke-opacity="0.7"/>
  <ellipse cx="380" cy="450" rx="60" ry="14" fill="none" stroke="#2dd4bf" stroke-width="1.5"/>

  <!-- Triangulation Angle Lines -->
  <line x1="380" y1="210" x2="270" y2="420" stroke="#f59e0b" stroke-width="1" stroke-dasharray="3,3" stroke-opacity="0.6"/>
  <line x1="380" y1="210" x2="490" y2="420" stroke="#f59e0b" stroke-width="1" stroke-dasharray="3,3" stroke-opacity="0.6"/>
  <text x="210" y="320" fill="#f59e0b" font-family="ui-monospace, monospace" font-size="9">TRIANGULATION ANGLE</text>

  <!-- Title Block Stamp Bottom Right -->
  <g transform="translate(520, 480)">
    <rect width="230" height="70" fill="#15181b" stroke="#2dd4bf" stroke-width="1"/>
    <line x1="0" y1="24" x2="230" y2="24" stroke="#2e353f" stroke-width="1"/>
    <line x1="0" y1="46" x2="230" y2="46" stroke="#2e353f" stroke-width="1"/>
    <line x1="120" y1="0" x2="120" y2="70" stroke="#2e353f" stroke-width="1"/>
    <text x="10" y="16" fill="#9ba3af" font-family="ui-monospace, monospace" font-size="9">SCALE: 1:1 SIGHT-SIZE</text>
    <text x="130" y="16" fill="#9ba3af" font-family="ui-monospace, monospace" font-size="9">MEDIUM: CHARCOAL / 2B</text>
    <text x="10" y="38" fill="#9ba3af" font-family="ui-monospace, monospace" font-size="9">STUDY: SPEED CONTOUR</text>
    <text x="130" y="38" fill="#2dd4bf" font-family="ui-monospace, monospace" font-size="9">VERIFIED: PHASE 01</text>
    <text x="10" y="60" fill="#f1f3f5" font-family="ui-monospace, monospace" font-size="10" font-weight="bold">DEN OF THE DRAFTSMAN</text>
    <text x="180" y="60" fill="#2dd4bf" font-family="ui-monospace, monospace" font-size="10">DWG 002</text>
  </g>
</svg>
