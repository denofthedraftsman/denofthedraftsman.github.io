<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#2dd4bf" stroke-width="0.5" stroke-opacity="0.12"/>
      <path d="M 200 0 L 0 0 0 200" fill="none" stroke="#2dd4bf" stroke-width="1" stroke-opacity="0.2"/>
    </pattern>
  </defs>
  <!-- Background -->
  <rect width="100%" height="100%" fill="#181d22"/>
  <rect width="100%" height="100%" fill="url(#grid)"/>

  <!-- Title Block Border -->
  <rect x="25" y="25" width="750" height="550" fill="none" stroke="#2e353f" stroke-width="2"/>
  <rect x="29" y="29" width="742" height="542" fill="none" stroke="#2dd4bf" stroke-width="0.75" stroke-opacity="0.4"/>

  <!-- Technical Header & Plate Metadata -->
  <text x="50" y="65" fill="#2dd4bf" font-family="ui-monospace, monospace" font-size="12" letter-spacing="3" text-anchor="start">PLATE 01 // PHASE 1: FOUNDATIONAL PERSPECTIVE</text>
  <text x="50" y="85" fill="#f1f3f5" font-family="-apple-system, sans-serif" font-size="18" font-weight="bold">Two-Point Perspective &amp; Box Rotation System</text>
  <text x="50" y="105" fill="#9ba3af" font-family="-apple-system, sans-serif" font-size="12">Reference: Perspective Made Easy by Ernest R. Norling — Measuring Points &amp; Eye Level</text>

  <!-- Horizon Line / Eye Level -->
  <line x1="50" y1="280" x2="750" y2="280" stroke="#38bdf8" stroke-width="1.5" stroke-dasharray="6,4"/>
  <text x="60" y="272" fill="#38bdf8" font-family="ui-monospace, monospace" font-size="10" letter-spacing="2">HORIZON LINE (EYE LEVEL)</text>
  
  <!-- Vanishing Points -->
  <circle cx="90" cy="280" r="4" fill="#38bdf8"/>
  <text x="90" y="300" fill="#38bdf8" font-family="ui-monospace, monospace" font-size="10" text-anchor="middle">VP-L</text>
  
  <circle cx="710" cy="280" r="4" fill="#38bdf8"/>
  <text x="710" y="300" fill="#38bdf8" font-family="ui-monospace, monospace" font-size="10" text-anchor="middle">VP-R</text>

  <!-- Central Leading Edge -->
  <line x1="400" y1="210" x2="400" y2="430" stroke="#f1f3f5" stroke-width="2"/>
  
  <!-- Perspective Projection Lines to VP-L -->
  <line x1="400" y1="210" x2="90" y2="280" stroke="#2dd4bf" stroke-width="1" stroke-opacity="0.4" stroke-dasharray="3,3"/>
  <line x1="400" y1="430" x2="90" y2="280" stroke="#2dd4bf" stroke-width="1" stroke-opacity="0.4" stroke-dasharray="3,3"/>
  <line x1="280" y1="240" x2="280" y2="395" stroke="#f1f3f5" stroke-width="2"/>
  <line x1="280" y1="240" x2="710" y2="280" stroke="#2dd4bf" stroke-width="0.75" stroke-opacity="0.3" stroke-dasharray="2,2"/>

  <!-- Perspective Projection Lines to VP-R -->
  <line x1="400" y1="210" x2="710" y2="280" stroke="#2dd4bf" stroke-width="1" stroke-opacity="0.4" stroke-dasharray="3,3"/>
  <line x1="400" y1="430" x2="710" y2="280" stroke="#2dd4bf" stroke-width="1" stroke-opacity="0.4" stroke-dasharray="3,3"/>
  <line x1="530" y1="245" x2="530" y2="390" stroke="#f1f3f5" stroke-width="2"/>
  <line x1="530" y1="245" x2="90" y2="280" stroke="#2dd4bf" stroke-width="0.75" stroke-opacity="0.3" stroke-dasharray="2,2"/>

  <!-- Primary Box Form -->
  <!-- Left Face -->
  <polygon points="400,210 280,240 280,395 400,430" fill="#2dd4bf" fill-opacity="0.08" stroke="#2dd4bf" stroke-width="2"/>
  <!-- Right Face -->
  <polygon points="400,210 530,245 530,390 400,430" fill="#2dd4bf" fill-opacity="0.03" stroke="#2dd4bf" stroke-width="2"/>
  <!-- Top Face (Crosses Eye Level) -->
  <polygon points="400,210 280,240 405,263 530,245" fill="#2dd4bf" fill-opacity="0.15" stroke="#2dd4bf" stroke-width="2"/>

  <!-- Rotated Box Study (Secondary) -->
  <polygon points="210,180 150,195 150,290 210,310" fill="none" stroke="#9ba3af" stroke-width="1.2" stroke-dasharray="4,2"/>
  <polygon points="210,180 270,205 270,300 210,310" fill="none" stroke="#9ba3af" stroke-width="1.2" stroke-dasharray="4,2"/>
  <polygon points="210,180 150,195 210,218 270,205" fill="none" stroke="#9ba3af" stroke-width="1.2" stroke-dasharray="4,2"/>

  <!-- Inclined Plane Wedge Study -->
  <polygon points="560,330 650,345 650,450 560,430" fill="#38bdf8" fill-opacity="0.06" stroke="#38bdf8" stroke-width="1.5"/>
  <line x1="560" y1="330" x2="650" y2="450" stroke="#38bdf8" stroke-width="1.5" stroke-dasharray="3,3"/>

  <!-- Dimensioning and Angles -->
  <path d="M 400 450 A 50 50 0 0 0 440 440" fill="none" stroke="#2dd4bf" stroke-width="1"/>
  <text x="445" y="455" fill="#2dd4bf" font-family="ui-monospace, monospace" font-size="10">60°</text>
  <path d="M 400 450 A 50 50 0 0 1 360 440" fill="none" stroke="#2dd4bf" stroke-width="1"/>
  <text x="335" y="455" fill="#2dd4bf" font-family="ui-monospace, monospace" font-size="10">30°</text>

  <!-- Title Block Stamp Bottom Right -->
  <g transform="translate(520, 480)">
    <rect width="230" height="70" fill="#15181b" stroke="#2dd4bf" stroke-width="1"/>
    <line x1="0" y1="24" x2="230" y2="24" stroke="#2e353f" stroke-width="1"/>
    <line x1="0" y1="46" x2="230" y2="46" stroke="#2e353f" stroke-width="1"/>
    <line x1="120" y1="0" x2="120" y2="70" stroke="#2e353f" stroke-width="1"/>
    <text x="10" y="16" fill="#9ba3af" font-family="ui-monospace, monospace" font-size="9">SCALE: N.T.S.</text>
    <text x="130" y="16" fill="#9ba3af" font-family="ui-monospace, monospace" font-size="9">MEDIUM: GRAPHITE 2H/HB</text>
    <text x="10" y="38" fill="#9ba3af" font-family="ui-monospace, monospace" font-size="9">DRAWN BY: DRAFTSMAN</text>
    <text x="130" y="38" fill="#2dd4bf" font-family="ui-monospace, monospace" font-size="9">VERIFIED: PHASE 01</text>
    <text x="10" y="60" fill="#f1f3f5" font-family="ui-monospace, monospace" font-size="10" font-weight="bold">DEN OF THE DRAFTSMAN</text>
    <text x="180" y="60" fill="#2dd4bf" font-family="ui-monospace, monospace" font-size="10">DWG 001</text>
  </g>
</svg>
